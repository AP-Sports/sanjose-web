<!DOCTYPE html>
<html lang="es">
<head>
 
  <link rel="icon" type="image/png" href="../img/logo.png">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Acceso al panel de administración"
  >

  <title>Administración - Congregación B. San José</title>

  <link rel="stylesheet" href="css/login.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

  <main class="login-card">

    <h1>Panel de administración</h1>

    <p class="subtitle">
      Congregación B. San José
    </p>

    <form id="login-form">

      <div class="field">
        <label for="email">
          Correo electrónico
        </label>

        <input
          id="email"
          type="email"
          autocomplete="username"
          required
        >
      </div>

      <div class="field">
        <label for="password">
          Contraseña
        </label>

        <input
          id="password"
          type="password"
          autocomplete="current-password"
          required
        >
      </div>

      <button
        id="login-button"
        type="submit"
      >
        Iniciar sesión
      </button>

      <p
        id="message"
        class="message"
        aria-live="polite"
      ></p>

    </form>


    <a
      class="back-button"
      href="../index.html"
    >
      Volver a la página principal
    </a>

  </main>

  <script src="js/login.js"></script>

</body>
</html>
