<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="Listas de la Congregación B. San José">

  <link rel="icon" type="image/png" href="img/logo.png">

  <title>Congregación B. San José</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <header class="site-header">

    <div class="header-inner">

      <div class="header-title">
        <h1>Congregación B. San José</h1>
        <p>Listas</p>
      </div>

      <a class="login-button" href="admin/panel.html" aria-label="Iniciar sesión" title="Iniciar sesión">
        <img src="img/sesion.png" alt="">
      </a>

    </div>

  </header>


  <!-- Menú de navegación -->


  <nav class="navigation" aria-label="Navegación principal">

    <span class="nav-indicator" aria-hidden="true"></span>

    <button class="nav-option" type="button" data-section="anuncios" aria-controls="anuncios" aria-pressed="false">
      Anuncios
    </button>

    <button class="nav-option active" type="button" data-section="listas" aria-controls="listas" aria-pressed="true">
      Listas
    </button>

  </nav>



  <main class="container">

    <!-- Sección de anuncios -->

    <section id="anuncios" class="content-section" aria-label="Anuncios" hidden>
      <!-- Aquí incorporaremos el contenido de anuncios. -->
    </section>


    <!-- Sección de listas -->

    <section id="listas" class="content-section active" aria-label="Listas">

      <label class="search-box" for="search">

        <span aria-hidden="true">⌕</span>

        <input id="search" type="search" placeholder="Buscar listas..." autocomplete="off">

      </label>


      <section id="list-grid" class="list-grid" aria-live="polite"></section>


      <p id="empty-state" class="empty-state" hidden>
        No se encontraron listas.
      </p>

    </section>

  </main>


  <!-- Visor de imágenes -->

  <div id="image-modal" class="image-modal" aria-hidden="true">

    <button id="modal-close" class="modal-close" type="button" aria-label="Cerrar">
      ×
    </button>

    <div class="modal-content">

      <img id="modal-image" src="" alt="">

    </div>

  </div>


  <!-- Supabase y aplicación actual -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="js/app.js"></script>

</body>

</html>
